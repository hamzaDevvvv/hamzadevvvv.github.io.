<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>h9exe | Cyber Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Orbitron&family=Inter&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: radial-gradient(circle at top, #0b111a, #020409);
  color:#eaffff;
  font-family: "Inter", sans-serif;
  height:100vh;
  overflow:hidden;
}

/* Grid */
body::before {
  content:"";
  position:fixed;
  inset:0;
  background:
    linear-gradient(#0f1a24 1px, transparent 1px),
    linear-gradient(90deg, #0f1a24 1px, transparent 1px);
  background-size:40px 40px;
  opacity:.25;
  z-index:-1;
}

/* Floating dashboard */
.dashboard {
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  width:90%;
  max-width:1000px;
  background:linear-gradient(180deg, #0b111a, #05080f);
  border:1px solid rgba(0,255,255,.4);
  border-radius:16px;
  box-shadow:0 0 60px rgba(0,255,255,.25);
  padding:2rem;
  animation: float 6s ease-in-out infinite;
}

@keyframes float {
  0%,100% { transform:translate(-50%,-50%) translateY(0); }
  50% { transform:translate(-50%,-50%) translateY(-10px); }
}

/* Header */
.header {
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  border-bottom:1px solid rgba(0,255,255,.2);
  padding-bottom:1rem;
}

.brand h1 {
  font-family:"Orbitron", sans-serif;
  font-size:2.8rem;
  color:#00fff7;
}

.brand p {
  color:#7be7ff;
  font-size:.85rem;
  letter-spacing:1px;
}

.status {
  text-align:right;
  font-size:.8rem;
  color:#9ff;
}

/* Panels */
.panels {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:1.5rem;
  margin-top:1.5rem;
}

.panel {
  background:#050b12;
  border:1px solid rgba(0,255,255,.3);
  border-radius:12px;
  padding:1rem;
  box-shadow:inset 0 0 20px rgba(0,255,255,.15);
}

.panel h3 {
  font-size:.8rem;
  letter-spacing:2px;
  color:#7be7ff;
  margin-bottom:.6rem;
}

/* Bars */
.bars {
  display:flex;
  gap:6px;
}
.bar {
  flex:1;
  height:22px;
  background:#0a1a22;
  border:1px solid #0ff;
}
.bar.active {
  background:#00fff7;
}

/* Terminal */
.terminal {
  margin-top:1.5rem;
  height:140px;
  background:black;
  border:1px solid #0ff;
  padding:10px;
  font-family:monospace;
  font-size:.8rem;
  overflow:auto;
  color:#00ff9c;
}

/* Buttons */
.buttons {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:1rem;
  margin-top:1.5rem;
}

.btn {
  padding:.8rem;
  background:#050b12;
  border:1px solid #0ff;
  color:#9ff;
  text-align:center;
  border-radius:6px;
  font-family:"Orbitron";
  font-size:.7rem;
  cursor:pointer;
  transition:.2s;
}
.btn:hover {
  background:#00fff7;
  color:#000;
}

/* Instagram */
.insta {
  position:absolute;
  bottom:15px;
  right:20px;
  font-size:.9rem;
}
.insta a {
  color:#00fff7;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="dashboard">
  <div class="header">
    <div class="brand">
      <h1>h9exe</h1>
      <p>// ETHICAL CYBERSECURITY DASHBOARD //</p>
    </div>
    <div class="status">
      <div id="time"></div>
      <div>UPLINK: <b>SECURE</b></div>
    </div>
  </div>

  <div class="panels">
    <div class="panel">
      <h3>TRAFFIC MONITORING</h3>
      <div class="bars" id="bars"></div>
    </div>
    <div class="panel">
      <h3>ACTIVE TASKS</h3>
      <div id="tasks"></div>
    </div>
  </div>

  <div class="buttons">
    <div class="btn">TRAFFIC</div>
    <div class="btn">SECURITY TEST</div>
    <div class="btn">PWD ANALYSIS</div>
    <div class="btn">ETHICAL MODE</div>
  </div>

  <div class="terminal" id="terminal"></div>

  <div class="insta">
    Instagram → <a href="https://instagram.com/h9exe" target="_blank">@h9exe</a>
  </div>
</div>

<script>
/* Time */
setInterval(()=>{
  const d=new Date();
  document.getElementById("time").textContent=d.toLocaleTimeString();
},1000);

/* Bars */
const bars=document.getElementById("bars");
for(let i=0;i<6;i++){
  const b=document.createElement("div");
  b.className="bar";
  bars.appendChild(b);
}

setInterval(()=>{
  [...bars.children].forEach(bar=>{
    bar.classList.toggle("active",Math.random()>.5);
  });
},800);

/* Tasks */
const tasks=[
  "Analyzing network patterns...",
  "Testing password strength...",
  "Monitoring authentication...",
  "Verifying system integrity...",
  "Simulating defensive scans..."
];

setInterval(()=>{
  document.getElementById("tasks").innerHTML="> "+tasks[Math.floor(Math.random()*tasks.length)];
},1500);

/* Terminal */
const term=document.getElementById("terminal");
setInterval(()=>{
  const line=document.createElement("div");
  line.textContent="> System check OK ["+Math.floor(Math.random()*9999)+"]";
  term.appendChild(line);
  term.scrollTop=term.scrollHeight;
},1200);
</script>

</body>
</html>

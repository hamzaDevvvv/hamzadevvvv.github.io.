<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>h9 | مرحباً</title>
  <meta http-equiv="refresh" content="3;url=https://discord.gg/lrn" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --discord: #5865F2;
      --discord-dark: #404EED;
      --bg: #0a0a0f;
      --surface: #12121a;
      --glow: rgba(88, 101, 242, 0.35);
      --text: #e8e8ff;
      --muted: #6b6b8a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Tajawal', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(88,101,242,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(88,101,242,0.05) 1px, transparent 1px);
      background-size: 60px 60px;
      animation: gridMove 20s linear infinite;
      z-index: 0;
    }

    @keyframes gridMove {
      0% { transform: translateY(0); }
      100% { transform: translateY(60px); }
    }

    /* Glow orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.3;
      z-index: 0;
      animation: float 8s ease-in-out infinite;
    }

    .orb-1 {
      width: 500px; height: 500px;
      background: var(--discord);
      top: -150px; left: -150px;
      animation-delay: 0s;
    }

    .orb-2 {
      width: 400px; height: 400px;
      background: #7289da;
      bottom: -100px; right: -100px;
      animation-delay: -4s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, -30px) scale(1.05); }
    }

    /* Card */
    .card {
      position: relative;
      z-index: 10;
      background: rgba(18, 18, 26, 0.85);
      border: 1px solid rgba(88, 101, 242, 0.3);
      border-radius: 24px;
      padding: 56px 64px;
      text-align: center;
      backdrop-filter: blur(20px);
      box-shadow:
        0 0 0 1px rgba(88,101,242,0.1),
        0 40px 80px rgba(0,0,0,0.5),
        0 0 120px var(--glow);
      animation: cardIn 0.7s cubic-bezier(0.16,1,0.3,1) both;
      max-width: 480px;
      width: 90%;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(40px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Logo */
    .logo {
      width: 80px; height: 80px;
      margin: 0 auto 28px;
      background: linear-gradient(135deg, var(--discord), #7289da);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 32px var(--glow);
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 8px 32px var(--glow); }
      50% { box-shadow: 0 8px 60px rgba(88,101,242,0.6); }
    }

    .logo svg { width: 44px; height: 44px; fill: white; }

    /* Tag */
    .tag {
      display: inline-block;
      background: rgba(88,101,242,0.15);
      border: 1px solid rgba(88,101,242,0.4);
      color: #9ba8ff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
      padding: 6px 16px;
      border-radius: 100px;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    h1 {
      font-size: 42px;
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #fff 0%, #9ba8ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: var(--muted);
      font-size: 17px;
      margin-bottom: 40px;
      line-height: 1.6;
    }

    /* Progress bar */
    .progress-wrap {
      background: rgba(88,101,242,0.1);
      border-radius: 100px;
      height: 6px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--discord), #7289da);
      border-radius: 100px;
      width: 0%;
      animation: fillBar 3s linear forwards;
      box-shadow: 0 0 10px var(--discord);
    }

    @keyframes fillBar {
      0%   { width: 0%; }
      100% { width: 100%; }
    }

    .redirect-text {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 32px;
    }

    /* Button */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, var(--discord), var(--discord-dark));
      color: #fff;
      text-decoration: none;
      font-family: 'Tajawal', sans-serif;
      font-size: 17px;
      font-weight: 700;
      padding: 16px 36px;
      border-radius: 14px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 24px rgba(88,101,242,0.4);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 40px rgba(88,101,242,0.6);
    }

    .btn svg { width: 22px; height: 22px; fill: white; flex-shrink: 0; }

    /* Bottom name */
    .footer-name {
      margin-top: 36px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 1px;
    }

    .footer-name span {
      color: #9ba8ff;
      font-weight: 700;
    }
  </style>
</head>

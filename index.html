<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>h9exe | Coming Soon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&display=swap');
        
        body {
            background-color: #050505;
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* تأثير التوهج في الخلفية */
        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(0, 150, 255, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
            filter: blur(50px);
            z-index: 1;
            animation: move 10s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(-50%, -50%); }
            to { transform: translate(50%, 50%); }
        }

        .main-text {
            position: relative;
            z-index: 10;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.3), 0 0 20px rgba(0,150,255,0.2);
            text-align: center;
        }

        .highlight {
            color: #00d4ff;
            text-shadow: 0 0 15px #00d4ff;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; text-shadow: 0 0 30px #00d4ff; }
        }
    </style>
</head>
<body>

    <div class="bg-glow" style="top: 20%; left: 30%;"></div>
    <div class="bg-glow" style="bottom: 10%; right: 20%; background: radial-gradient(circle, rgba(138, 43, 226, 0.1) 0%, rgba(0, 0, 0, 0) 70%);"></div>

    <div class="main-text">
        <h1 class="text-5xl md:text-7xl font-black mb-4 tracking-widest">
            h9<span class="highlight">exe</span>
        </h1>
        <p class="text-gray-400 text-sm md:text-lg tracking-[0.5em] uppercase opacity-80">
            Service soon...
        </p>
    </div>

</body>
</html>

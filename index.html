<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remiel Design Maker</title>
    <style>
        :root {
            --bg: #08101c;
            --panel: #0f1b2d;
            --line: #31557f;
            --text: #eaf5ff;
            --muted: #9cb8d6;
            --input: #071121;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(900px 420px at 8% -25%, #15365f 0%, rgba(21, 54, 95, 0) 70%),
                radial-gradient(900px 420px at 96% -25%, #13284b 0%, rgba(19, 40, 75, 0) 70%),
                var(--bg);
            color: var(--text);
            font-family: Consolas, "Courier New", monospace;
            padding: 18px;
        }

        .wrap {
            width: min(1400px, 100%);
            margin: 0 auto;
            display: grid;
            grid-template-columns: 470px 1fr;
            gap: 14px;
        }

        .panel {
            background: linear-gradient(180deg, #111d2f 0%, #0d1829 100%);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 12px;
        }

        h1, h2 {
            margin: 0 0 10px;
            font-weight: 700;
        }

        h1 { font-size: 30px; }
        h2 { font-size: 18px; color: var(--muted); }

        .picker-wrap {
            display: grid;
            grid-template-columns: 260px 16px 1fr;
            gap: 12px;
            margin-bottom: 10px;
        }

        #svCanvas,
        #hueCanvas {
            border: 1px solid #3a628f;
            background: #fff;
            touch-action: none;
        }

        #svCanvas { cursor: crosshair; }
        #hueCanvas { cursor: ns-resize; }

        .picker-right { display: grid; gap: 8px; }

        .swatch-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .swatch {
            width: 56px;
            height: 28px;
            border: 1px solid #3a628f;
            cursor: pointer;
        }

        .active-swatch { outline: 2px solid #86e8ff; }

        .field-grid {
            display: grid;
            grid-template-columns: 18px 50px 18px 50px 12px;
            gap: 6px;
            align-items: center;
        }

        .field-grid input,
        .hex-row input,
        select,
        textarea,
        .meta-row input {
            width: 100%;
            border: 1px solid #3a628f;
            background: var(--input);
            color: var(--text);
            padding: 5px 6px;
            border-radius: 4px;
            font-family: Consolas, "Courier New", monospace;
        }

        .hex-row {
            display: grid;
            grid-template-columns: 14px 1fr;
            gap: 6px;
            align-items: center;
        }

        .meta-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            margin: 10px 0;
        }

        .mode-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 10px 0 8px;
        }

        .mode-grid label {
            display: grid;
            gap: 4px;
            font-size: 12px;
            color: var(--muted);
        }

        .toggles {
            display: flex;
            gap: 14px;
            margin-bottom: 8px;
            color: var(--muted);
            font-size: 12px;
            flex-wrap: wrap;
        }

        .toggles label {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        textarea {
            min-height: 230px;
            resize: vertical;
            white-space: pre;
            line-height: 1.15;
            font-size: 14px;
        }

        .actions {
            margin-top: 8px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .stats {
            margin-top: 8px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            color: #9ec2e3;
            font-size: 12px;
        }

        .stats span {
            display: block;
            border: 1px solid #345c85;
            border-radius: 4px;
            padding: 5px 6px;
            background: #091628;
        }

        button {
            border: 1px solid #446991;
            border-radius: 4px;
            padding: 10px;
            color: #eaf5ff;
            background: #1a2f4a;
            font-weight: 700;
            cursor: pointer;
        }

        #seeBtn { background: #1c4165; }
        #saveBtn { background: #225166; }

        .color-grid {
            display: grid;
            grid-template-columns: repeat(13, 1fr);
            gap: 1px;
            width: 100%;
            border: 1px solid #3a628f;
            background: #3a628f;
        }

        .cell {
            height: 22px;
            cursor: pointer;
            border: 1px solid rgba(0, 0, 0, 0.24);
        }

        .preview-wrap {
            display: grid;
            gap: 10px;
        }

        .preview-card {
            border: 1px solid #2f5881;
            border-radius: 6px;
            background: #030b18;
            padding: 8px;
        }

        .preview-title {
            margin: 0 0 6px;
            color: #98b8d9;
            font-size: 12px;
        }

        pre {
            margin: 0;
            white-space: pre;
            overflow: auto;
            min-height: 175px;
            border: 1px solid #3a628f;
            background: #020714;
            padding: 8px;
            line-height: 1.13;
            font-size: 13px;
            color: #fff;
        }

        .hint {
            margin: 0 0 8px;
            color: var(--muted);
            font-size: 13px;
        }

        .credit {
            margin-top: 8px;
            color: #a9bed8;
            font-size: 12px;
            letter-spacing: .3px;
        }

        @media (max-width: 1100px) {
            .wrap { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <main class="wrap">
        <section class="panel">
            <h1>Remiel Design Maker</h1>
            <h2>One design, rendered once</h2>

            <div class="picker-wrap">
                <canvas id="svCanvas" width="260" height="180"></canvas>
                <canvas id="hueCanvas" width="16" height="180"></canvas>

                <div class="picker-right">
                    <div class="swatch-row">
                        <div id="startSwatch" class="swatch active-swatch" title="Start color"></div>
                        <div id="midSwatch" class="swatch" title="Middle color"></div>
                        <div id="endSwatch" class="swatch" title="End color"></div>
                    </div>

                    <div class="field-grid">
                        <span>R</span><input id="rVal" />
                        <span>H</span><input id="hVal" />
                        <span>o</span>

                        <span>G</span><input id="gVal" />
                        <span>S</span><input id="sVal" />
                        <span>%</span>

                        <span>B</span><input id="bVal" />
                        <span>V</span><input id="vVal" />
                        <span>%</span>
                    </div>

                    <div class="hex-row">
                        <span>#</span>
                        <input id="hexVal" value="FFFFFF" />
                    </div>
                </div>
            </div>

            <div id="colorGrid" class="color-grid"></div>

            <div class="mode-grid">
                <label>Color Mode
                    <select id="modeSelect">
                        <option value="all">All non-space</option>
                        <option value="text">Text only</option>
                        <option value="symbols">Symbols only</option>
                        <option value="box">Box/Braille only</option>
                    </select>
                </label>
                <label>Gradient Direction
                    <select id="directionSelect">
                        <option value="horizontal">Horizontal</option>
                        <option value="vertical">Vertical</option>
                        <option value="diagonal">Diagonal</option>
                    </select>
                </label>
                <label>Gradient Curve
                    <select id="curveSelect">
                        <option value="linear">Linear</option>
                        <option value="smooth">Smooth</option>
                        <option value="hard">Hard</option>
                    </select>
                </label>
                <label>Color Preset
                    <select id="presetSelect">
                        <option value="custom">Custom</option>
                        <option value="fire">Fire</option>
                        <option value="ice">Ice</option>
                        <option value="toxic">Toxic</option>
                        <option value="gold">Gold</option>
                        <option value="sunset">Sunset</option>
                    </select>
                </label>
                <label>Jitter (0-30)
                    <input id="jitterInput" value="0" />
                </label>
            </div>

            <div class="toggles">
                <label><input type="checkbox" id="invertToggle" /> Invert Gradient</label>
                <label><input type="checkbox" id="glowToggle" /> Glow Preview</label>
                <label><input type="checkbox" id="animateToggle" /> Animate Wave</label>
            </div>

            <p class="hint">Paste your design below. Use {{TITLE}} to inject the title above.</p>
            <textarea id="designInput">╔════════════════════════════════════════════╗
║     {{TITLE}}                             ║
╠════════════════════════════════════════════╣
║  ~ Feature One                            ║
║  ~ Feature Two                            ║
║  ~ Feature Three                          ║
╚════════════════════════════════════════════╝</textarea>

            <div class="actions">
                <button id="seeBtn">See</button>
                <button id="saveBtn">Save ANSI</button>
                <button id="savePlainBtn">Save Plain</button>
                <button id="copyAnsiBtn">Copy ANSI</button>
                <button id="copyPlainBtn">Copy Plain</button>
                <button id="applyPresetBtn">Apply Preset</button>
                <button id="randomBtn">Random Colors</button>
                <button id="swapBtn">Swap Ends</button>
                <button id="resetBtn">Reset</button>
            </div>

            <div class="stats">
                <span id="statLines">Lines: 0</span>
                <span id="statChars">Chars: 0</span>
                <span id="statColored">Colored: 0</span>
                <span id="statMode">Mode: all</span>
            </div>

            <div class="credit">Rights: Remiel</div>
        </section>

        <section class="panel">
            <p class="hint">Preview</p>
            <div id="previewWrap" class="preview-wrap">
                <div class="preview-card">
                    <p class="preview-title">Copy 1</p>
                    <pre id="result1"></pre>
                </div>
            </div>
        </section>
    </main>

    <script>
        const svCanvas = document.getElementById('svCanvas');
        const hueCanvas = document.getElementById('hueCanvas');
        const svCtx = svCanvas.getContext('2d');
        const hueCtx = hueCanvas.getContext('2d');

        const rVal = document.getElementById('rVal');
        const gVal = document.getElementById('gVal');
        const bVal = document.getElementById('bVal');
        const hVal = document.getElementById('hVal');
        const sVal = document.getElementById('sVal');
        const vVal = document.getElementById('vVal');
        const hexVal = document.getElementById('hexVal');

        const startSwatch = document.getElementById('startSwatch');
        const midSwatch = document.getElementById('midSwatch');
        const endSwatch = document.getElementById('endSwatch');

        const colorGrid = document.getElementById('colorGrid');
        const modeSelect = document.getElementById('modeSelect');
        const directionSelect = document.getElementById('directionSelect');
        const curveSelect = document.getElementById('curveSelect');
        const presetSelect = document.getElementById('presetSelect');
        const jitterInput = document.getElementById('jitterInput');
        const invertToggle = document.getElementById('invertToggle');
        const glowToggle = document.getElementById('glowToggle');
        const animateToggle = document.getElementById('animateToggle');
        const designInput = document.getElementById('designInput');
        const result1 = document.getElementById('result1');
        const statLines = document.getElementById('statLines');
        const statChars = document.getElementById('statChars');
        const statColored = document.getElementById('statColored');
        const statMode = document.getElementById('statMode');

        let lastAnsiOutput = '';
        let lastPlainOutput = '';
        let animationFrame = 0;
        const defaultTemplate = designInput.value;

        const presets = {
            fire: { start: { r: 90, g: 0, b: 0 }, mid: { r: 255, g: 90, b: 0 }, end: { r: 255, g: 245, b: 180 } },
            ice: { start: { r: 0, g: 38, b: 90 }, mid: { r: 65, g: 180, b: 255 }, end: { r: 220, g: 248, b: 255 } },
            toxic: { start: { r: 6, g: 60, b: 0 }, mid: { r: 80, g: 255, b: 0 }, end: { r: 225, g: 255, b: 170 } },
            gold: { start: { r: 70, g: 45, b: 0 }, mid: { r: 236, g: 185, b: 35 }, end: { r: 255, g: 242, b: 180 } },
            sunset: { start: { r: 54, g: 0, b: 73 }, mid: { r: 255, g: 66, b: 108 }, end: { r: 255, g: 197, b: 130 } }
        };

        const state = {
            active: 'start',
            hue: 0,
            sat: 100,
            val: 85,
            start: { r: 120, g: 20, b: 20 },
            mid: { r: 220, g: 220, b: 220 },
            end: { r: 255, g: 255, b: 255 },
            mode: 'all',
            direction: 'horizontal',
            curve: 'linear',
            jitter: 0,
            invert: false,
            glow: false,
            animate: false
        };

        function clamp(n, min, max) {
            return Math.max(min, Math.min(max, n));
        }

        function rgbToHex(r, g, b) {
            const h = n => clamp(n, 0, 255).toString(16).padStart(2, '0').toUpperCase();
            return h(r) + h(g) + h(b);
        }

        function hexToRgb(hex) {
            const clean = hex.replace('#', '').toUpperCase();
            if (!/^[0-9A-F]{6}$/.test(clean)) return null;
            return {
                r: parseInt(clean.slice(0, 2), 16),
                g: parseInt(clean.slice(2, 4), 16),
                b: parseInt(clean.slice(4, 6), 16)
            };
        }

        function hsvToRgb(h, s, v) {
            const hh = (h % 360 + 360) % 360;
            const ss = clamp(s, 0, 100) / 100;
            const vv = clamp(v, 0, 100) / 100;
            const c = vv * ss;
            const x = c * (1 - Math.abs((hh / 60) % 2 - 1));
            const m = vv - c;
            let rp = 0;
            let gp = 0;
            let bp = 0;
            if (hh < 60) { rp = c; gp = x; }
            else if (hh < 120) { rp = x; gp = c; }
            else if (hh < 180) { gp = c; bp = x; }
            else if (hh < 240) { gp = x; bp = c; }
            else if (hh < 300) { rp = x; bp = c; }
            else { rp = c; bp = x; }
            return {
                r: Math.round((rp + m) * 255),
                g: Math.round((gp + m) * 255),
                b: Math.round((bp + m) * 255)
            };
        }

        function rgbToHsv(r, g, b) {
            const rr = r / 255;
            const gg = g / 255;
            const bb = b / 255;
            const max = Math.max(rr, gg, bb);
            const min = Math.min(rr, gg, bb);
            const d = max - min;
            let h = 0;
            if (d !== 0) {
                if (max === rr) h = 60 * (((gg - bb) / d) % 6);
                else if (max === gg) h = 60 * ((bb - rr) / d + 2);
                else h = 60 * ((rr - gg) / d + 4);
            }
            if (h < 0) h += 360;
            const s = max === 0 ? 0 : (d / max) * 100;
            const v = max * 100;
            return { h: Math.round(h), s: Math.round(s), v: Math.round(v) };
        }

        function drawHueBar() {
            const grad = hueCtx.createLinearGradient(0, 0, 0, hueCanvas.height);
            grad.addColorStop(0, '#ff0000');
            grad.addColorStop(1 / 6, '#ffff00');
            grad.addColorStop(2 / 6, '#00ff00');
            grad.addColorStop(3 / 6, '#00ffff');
            grad.addColorStop(4 / 6, '#0000ff');
            grad.addColorStop(5 / 6, '#ff00ff');
            grad.addColorStop(1, '#ff0000');
            hueCtx.fillStyle = grad;
            hueCtx.fillRect(0, 0, hueCanvas.width, hueCanvas.height);
            const y = (state.hue / 360) * hueCanvas.height;
            hueCtx.strokeStyle = '#fff';
            hueCtx.lineWidth = 2;
            hueCtx.strokeRect(0, y - 2, hueCanvas.width, 4);
        }

        function drawSvBox() {
            const pure = hsvToRgb(state.hue, 100, 100);
            svCtx.fillStyle = 'rgb(' + pure.r + ',' + pure.g + ',' + pure.b + ')';
            svCtx.fillRect(0, 0, svCanvas.width, svCanvas.height);

            const whiteGrad = svCtx.createLinearGradient(0, 0, svCanvas.width, 0);
            whiteGrad.addColorStop(0, 'rgba(255,255,255,1)');
            whiteGrad.addColorStop(1, 'rgba(255,255,255,0)');
            svCtx.fillStyle = whiteGrad;
            svCtx.fillRect(0, 0, svCanvas.width, svCanvas.height);

            const blackGrad = svCtx.createLinearGradient(0, 0, 0, svCanvas.height);
            blackGrad.addColorStop(0, 'rgba(0,0,0,0)');
            blackGrad.addColorStop(1, 'rgba(0,0,0,1)');
            svCtx.fillStyle = blackGrad;
            svCtx.fillRect(0, 0, svCanvas.width, svCanvas.height);

            const x = (state.sat / 100) * svCanvas.width;
            const y = ((100 - state.val) / 100) * svCanvas.height;
            svCtx.strokeStyle = '#fff';
            svCtx.lineWidth = 2;
            svCtx.beginPath();
            svCtx.arc(x, y, 6, 0, Math.PI * 2);
            svCtx.stroke();
        }

        function updateUiFields() {
            const rgb = state[state.active];
            const hsv = rgbToHsv(rgb.r, rgb.g, rgb.b);
            rVal.value = rgb.r;
            gVal.value = rgb.g;
            bVal.value = rgb.b;
            hVal.value = hsv.h;
            sVal.value = hsv.s;
            vVal.value = hsv.v;
            hexVal.value = rgbToHex(rgb.r, rgb.g, rgb.b);

            startSwatch.style.background = 'rgb(' + state.start.r + ',' + state.start.g + ',' + state.start.b + ')';
            midSwatch.style.background = 'rgb(' + state.mid.r + ',' + state.mid.g + ',' + state.mid.b + ')';
            endSwatch.style.background = 'rgb(' + state.end.r + ',' + state.end.g + ',' + state.end.b + ')';
            startSwatch.classList.toggle('active-swatch', state.active === 'start');
            midSwatch.classList.toggle('active-swatch', state.active === 'mid');
            endSwatch.classList.toggle('active-swatch', state.active === 'end');

            drawSvBox();
            drawHueBar();
        }

        function loadHSVFromActiveColor() {
            const rgb = state[state.active];
            const hsv = rgbToHsv(rgb.r, rgb.g, rgb.b);
            state.hue = hsv.h;
            state.sat = hsv.s;
            state.val = hsv.v;
        }

        function syncActiveColorFromHSV() {
            state[state.active] = hsvToRgb(state.hue, state.sat, state.val);
            updateUiFields();
            renderAll();
        }

        function colorAtT(t) {
            if (t <= 0.5) {
                const tt = t * 2;
                return {
                    r: Math.round(state.start.r + (state.mid.r - state.start.r) * tt),
                    g: Math.round(state.start.g + (state.mid.g - state.start.g) * tt),
                    b: Math.round(state.start.b + (state.mid.b - state.start.b) * tt)
                };
            }
            const tt = (t - 0.5) * 2;
            return {
                r: Math.round(state.mid.r + (state.end.r - state.mid.r) * tt),
                g: Math.round(state.mid.g + (state.end.g - state.mid.g) * tt),
                b: Math.round(state.mid.b + (state.end.b - state.mid.b) * tt)
            };
        }

        function applyCurve(t) {
            if (state.curve === 'smooth') {
                return t * t * (3 - 2 * t);
            }
            if (state.curve === 'hard') {
                return t < 0.5 ? t * 0.7 : 0.35 + (t - 0.5) * 1.3;
            }
            return t;
        }

        function isTextChar(ch) {
            return /[A-Za-z0-9]/.test(ch);
        }

        function isBoxOrBraille(ch) {
            const code = ch.charCodeAt(0);
            return (code >= 0x2500 && code <= 0x257F) || (code >= 0x2800 && code <= 0x28FF);
        }

        function shouldColorChar(ch) {
            if (ch === ' ') return false;
            if (state.mode === 'all') return true;
            if (state.mode === 'text') return isTextChar(ch);
            if (state.mode === 'symbols') return !isTextChar(ch);
            if (state.mode === 'box') return isBoxOrBraille(ch);
            return true;
        }

        function gradientT(col, row, width, height) {
            let t;
            if (state.direction === 'vertical') {
                t = height > 1 ? row / (height - 1) : 0;
            } else if (state.direction === 'diagonal') {
                const x = width > 1 ? col / (width - 1) : 0;
                const y = height > 1 ? row / (height - 1) : 0;
                t = (x + y) / 2;
            } else {
                t = width > 1 ? col / (width - 1) : 0;
            }
            if (state.jitter > 0) {
                const n = Math.sin((col + 1) * 12.9898 + (row + 1) * 78.233) * 43758.5453;
                const fract = n - Math.floor(n);
                t += ((fract - 0.5) * state.jitter) / 100;
            }
            if (state.animate) {
                t += Math.sin((col * 0.23) + (row * 0.17) + animationFrame) * 0.08;
            }
            if (state.invert) t = 1 - t;
            return clamp(applyCurve(t), 0, 1);
        }

        function renderOne(sourceText, preEl) {
            const lines = sourceText.replace(/\r/g, '').split('\n');
            const width = Math.max(...lines.map(l => l.length), 1);
            preEl.innerHTML = '';

            let ansi = '';
            let plain = '';
            let coloredCount = 0;
            lines.forEach((line, rowIndex) => {
                for (let i = 0; i < width; i++) {
                    const ch = line[i] || ' ';
                    const span = document.createElement('span');

                    if (shouldColorChar(ch)) {
                        coloredCount++;
                        const c = colorAtT(gradientT(i, rowIndex, width, lines.length));
                        span.style.color = 'rgb(' + c.r + ',' + c.g + ',' + c.b + ')';
                        if (state.glow) {
                            span.style.textShadow = '0 0 8px rgba(' + c.r + ',' + c.g + ',' + c.b + ',0.45)';
                        }
                        ansi += '\u001b[38;2;' + c.r + ';' + c.g + ';' + c.b + 'm' + ch;
                    } else {
                        span.style.color = '#ffffff';
                        ansi += '\u001b[38;2;255;255;255m' + ch;
                    }

                    span.textContent = ch;
                    preEl.appendChild(span);
                    plain += ch;
                }
                ansi += '\u001b[0m\n';
                plain += '\n';
                if (rowIndex < lines.length - 1) preEl.appendChild(document.createElement('br'));
            });
            return { ansi, plain, lines: lines.length, chars: width * lines.length, colored: coloredCount };
        }

        function buildSource() {
            return designInput.value.replace(/{{TITLE}}/g, 'Remiel');
        }

        function renderAll() {
            const source = buildSource();
            const rendered = renderOne(source, result1);
            lastAnsiOutput = rendered.ansi;
            lastPlainOutput = rendered.plain;
            statLines.textContent = 'Lines: ' + rendered.lines;
            statChars.textContent = 'Chars: ' + rendered.chars;
            statColored.textContent = 'Colored: ' + rendered.colored;
            statMode.textContent = 'Mode: ' + state.mode;
        }

        function saveAnsiOutput() {
            if (!lastAnsiOutput) renderAll();
            if (!lastAnsiOutput) return;
            const blob = new Blob([lastAnsiOutput], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'triple-design-ansi.tfx';
            a.click();
            if (navigator.clipboard) navigator.clipboard.writeText(lastAnsiOutput).catch(() => {});
        }

        function savePlainOutput() {
            if (!lastPlainOutput) renderAll();
            if (!lastPlainOutput) return;
            const blob = new Blob([lastPlainOutput], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'remiel-design-plain.tfx';
            a.click();
        }

        function applyPreset(name) {
            const p = presets[name];
            if (!p) return;
            state.start = { ...p.start };
            state.mid = { ...p.mid };
            state.end = { ...p.end };
            loadHSVFromActiveColor();
            updateUiFields();
            renderAll();
        }

        function tickAnimation() {
            if (state.animate) {
                animationFrame += 0.08;
                renderAll();
            }
            requestAnimationFrame(tickAnimation);
        }

        function randomRgb() {
            return {
                r: Math.floor(Math.random() * 256),
                g: Math.floor(Math.random() * 256),
                b: Math.floor(Math.random() * 256)
            };
        }

        function buildColorGrid() {
            colorGrid.innerHTML = '';
            for (let row = 0; row < 9; row++) {
                const v = 100 - row * 8;
                for (let col = 0; col < 13; col++) {
                    const h = Math.round((col / 12) * 360);
                    const rgb = hsvToRgb(h, 100, v);
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.style.background = 'rgb(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ')';
                    cell.addEventListener('click', () => {
                        state[state.active] = rgb;
                        loadHSVFromActiveColor();
                        updateUiFields();
                        renderAll();
                    });
                    colorGrid.appendChild(cell);
                }
            }
        }

        function handleSVEvent(e) {
            const rect = svCanvas.getBoundingClientRect();
            const x = clamp(e.clientX - rect.left, 0, svCanvas.width);
            const y = clamp(e.clientY - rect.top, 0, svCanvas.height);
            state.sat = Math.round((x / svCanvas.width) * 100);
            state.val = Math.round(100 - (y / svCanvas.height) * 100);
            syncActiveColorFromHSV();
        }

        function handleHueEvent(e) {
            const rect = hueCanvas.getBoundingClientRect();
            const y = clamp(e.clientY - rect.top, 0, hueCanvas.height);
            state.hue = Math.round((y / hueCanvas.height) * 360);
            if (state.hue > 359) state.hue = 359;
            syncActiveColorFromHSV();
        }

        function wireCanvasDrag(canvas, handler) {
            let drag = false;
            canvas.addEventListener('mousedown', e => { drag = true; handler(e); });
            window.addEventListener('mousemove', e => { if (drag) handler(e); });
            window.addEventListener('mouseup', () => { drag = false; });

            canvas.addEventListener('touchstart', e => {
                drag = true;
                handler(e.touches[0]);
            }, { passive: true });
            window.addEventListener('touchmove', e => {
                if (drag) handler(e.touches[0]);
            }, { passive: true });
            window.addEventListener('touchend', () => { drag = false; });
        }

        function applyRgbInputs() {
            state[state.active] = {
                r: clamp(parseInt(rVal.value, 10) || 0, 0, 255),
                g: clamp(parseInt(gVal.value, 10) || 0, 0, 255),
                b: clamp(parseInt(bVal.value, 10) || 0, 0, 255)
            };
            loadHSVFromActiveColor();
            updateUiFields();
            renderAll();
        }

        function applyHsvInputs() {
            state.hue = clamp(parseInt(hVal.value, 10) || 0, 0, 359);
            state.sat = clamp(parseInt(sVal.value, 10) || 0, 0, 100);
            state.val = clamp(parseInt(vVal.value, 10) || 0, 0, 100);
            syncActiveColorFromHSV();
        }

        function applyHexInput() {
            const rgb = hexToRgb(hexVal.value.trim());
            if (!rgb) return;
            state[state.active] = rgb;
            loadHSVFromActiveColor();
            updateUiFields();
            renderAll();
        }

        startSwatch.addEventListener('click', () => {
            state.active = 'start';
            loadHSVFromActiveColor();
            updateUiFields();
        });

        midSwatch.addEventListener('click', () => {
            state.active = 'mid';
            loadHSVFromActiveColor();
            updateUiFields();
        });

        endSwatch.addEventListener('click', () => {
            state.active = 'end';
            loadHSVFromActiveColor();
            updateUiFields();
        });

        wireCanvasDrag(svCanvas, handleSVEvent);
        wireCanvasDrag(hueCanvas, handleHueEvent);

        [rVal, gVal, bVal].forEach(el => el.addEventListener('change', applyRgbInputs));
        [hVal, sVal, vVal].forEach(el => el.addEventListener('change', applyHsvInputs));
        hexVal.addEventListener('change', applyHexInput);

        designInput.addEventListener('input', renderAll);

        document.getElementById('seeBtn').addEventListener('click', renderAll);
        document.getElementById('saveBtn').addEventListener('click', saveAnsiOutput);
        document.getElementById('savePlainBtn').addEventListener('click', savePlainOutput);
        document.getElementById('copyAnsiBtn').addEventListener('click', () => {
            if (!lastAnsiOutput) renderAll();
            if (navigator.clipboard) navigator.clipboard.writeText(lastAnsiOutput).catch(() => {});
        });
        document.getElementById('copyPlainBtn').addEventListener('click', () => {
            if (!lastPlainOutput) renderAll();
            if (navigator.clipboard) navigator.clipboard.writeText(lastPlainOutput).catch(() => {});
        });
        document.getElementById('applyPresetBtn').addEventListener('click', () => {
            applyPreset(presetSelect.value);
        });
        document.getElementById('randomBtn').addEventListener('click', () => {
            state.start = randomRgb();
            state.mid = randomRgb();
            state.end = randomRgb();
            presetSelect.value = 'custom';
            loadHSVFromActiveColor();
            updateUiFields();
            renderAll();
        });
        document.getElementById('swapBtn').addEventListener('click', () => {
            const tmp = state.start;
            state.start = state.end;
            state.end = tmp;
            loadHSVFromActiveColor();
            updateUiFields();
            renderAll();
        });
        document.getElementById('resetBtn').addEventListener('click', () => {
            designInput.value = defaultTemplate;
            state.mode = 'all';
            state.direction = 'horizontal';
            state.curve = 'linear';
            state.jitter = 0;
            state.invert = false;
            state.glow = false;
            state.animate = false;
            modeSelect.value = 'all';
            directionSelect.value = 'horizontal';
            curveSelect.value = 'linear';
            presetSelect.value = 'custom';
            jitterInput.value = '0';
            invertToggle.checked = false;
            glowToggle.checked = false;
            animateToggle.checked = false;
            renderAll();
        });

        modeSelect.addEventListener('change', () => {
            state.mode = modeSelect.value;
            renderAll();
        });

        directionSelect.addEventListener('change', () => {
            state.direction = directionSelect.value;
            renderAll();
        });

        curveSelect.addEventListener('change', () => {
            state.curve = curveSelect.value;
            renderAll();
        });

        jitterInput.addEventListener('change', () => {
            state.jitter = clamp(parseInt(jitterInput.value, 10) || 0, 0, 30);
            jitterInput.value = String(state.jitter);
            renderAll();
        });

        presetSelect.addEventListener('change', () => {
            if (presetSelect.value !== 'custom') {
                applyPreset(presetSelect.value);
            }
        });

        invertToggle.addEventListener('change', () => {
            state.invert = invertToggle.checked;
            renderAll();
        });

        glowToggle.addEventListener('change', () => {
            state.glow = glowToggle.checked;
            renderAll();
        });

        animateToggle.addEventListener('change', () => {
            state.animate = animateToggle.checked;
            renderAll();
        });

        buildColorGrid();
        loadHSVFromActiveColor();
        updateUiFields();
        renderAll();
        tickAnimation();
    </script>
</body>
</html>

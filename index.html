<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>h9exe // Advanced Command Center</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ff9d; /* Neon Green */
            --accent: #0084ff;  /* Cyber Blue */
            --danger: #ff3e3e;  /* Red for DDOS */
            --bg: #050506;
            --panel-bg: rgba(15, 15, 20, 0.9);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 255, 157, 0.05) 0%, transparent 80%),
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            color: #e0e0e0;
            font-family: 'JetBrains Mono', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* Scanline Effect */
        body::after {
            content: " ";
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            z-index: 100;
            pointer-events: none;
            opacity: 0.2;
        }

        .main-frame {
            width: 95vw;
            height: 95vh;
            max-width: 1400px;
            display: grid;
            grid-template-columns: 280px 1fr 280px;
            grid-template-rows: auto 1fr auto;
            gap: 15px;
            padding: 15px;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
            position: relative;
        }

        /* --- Header --- */
        header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .logo-area .title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            color: var(--primary);
            text-shadow: 0 0 10px rgba(0, 255, 157, 0.5);
        }

        /* --- Panels --- */
        .panel {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            padding: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            font-size: 11px;
            color: var(--accent);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(0, 132, 255, 0.2);
            padding-bottom: 4px;
        }

        /* --- Stats & Progress --- */
        .stat-row { margin-bottom: 10px; }
        .label { font-size: 9px; color: #888; display: block; margin-bottom: 3px; }
        .progress-bg { height: 4px; background: #111; border-radius: 2px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.5s; }

        /* --- Terminal --- */
        .terminal-box { grid-column: 2; }
        #output {
            flex-grow: 1;
            font-size: 12px;
            overflow-y: auto;
            color: #ccc;
            padding-right: 5px;
        }
        .input-line {
            display: flex;
            gap: 10px;
            background: rgba(255,255,255,0.05);
            padding: 8px;
            border-radius: 4px;
        }
        input {
            background: transparent; border: none; color: white; outline: none; flex-grow: 1; font-family: inherit;
        }

        /* --- Global Feed --- */
        .node-item { display: flex; justify-content: space-between; font-size: 9px; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.02); }
        .online { color: var(--primary); }

        /* --- Responsive Logic --- */
        @media (max-width: 1024px) {
            .main-frame {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr auto;
                height: auto;
                min-height: 100vh;
            }
            .hide-mobile { display: none; }
            .terminal-box { grid-column: 1; height: 400px; }
        }

        footer {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #444;
            padding-top: 10px;
        }
        .insta-link { color: var(--primary); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="main-frame">
    <header>
        <div class="logo-area">
            <div class="title">h9exe</div>
            <div style="font-size: 9px; color: #555;">&lt; NEURAL INTERFACE v4.0.2 &gt;</div>
        </div>
        <div style="text-align: right">
            <div id="clock" style="font-size: 16px; color: white;">00:00:00</div>
            <div style="font-size: 9px; color: var(--primary);">UPLINK: SECURE</div>
        </div>
    </header>

    <aside class="panel">
        <div class="panel-header"><span>SYSTEM LOAD</span></div>
        <div class="stat-row">
            <span class="label">CPU</span>
            <div class="progress-bg"><div class="progress-fill" id="cpu-bar" style="width: 40%"></div></div>
        </div>
        <div class="stat-row">
            <span class="label">MEMORY</span>
            <div class="progress-bg"><div class="progress-fill" id="ram-bar" style="width: 60%"></div></div>
        </div>
        
        <div class="panel-header" style="margin-top: 20px;"><span>ENCRYPTION</span></div>
        <div id="enc-key" style="font-size: 9px; word-break: break-all; color: #555;">Initializing...</div>
    </aside>

    <section class="panel terminal-box">
        <div class="panel-header"><span>ROOT@H9EXE:~</span><span>SESSION: ACTIVE</span></div>
        <div id="output"></div>
        <div class="input-line">
            <span style="color: var(--primary)">$</span>
            <input type="text" id="commandInput" placeholder="Enter command (e.g. ddos, help)..." autocomplete="off" autofocus>
        </div>
    </section>

    <aside class="panel hide-mobile">
        <div class="panel-header"><span>THREAT FEED</span></div>
        <div id="threat-feed"></div>

        <div class="panel-header" style="margin-top: 20px;"><span>NODES</span></div>
        <div class="node-item"><span>Tokyo_Hub</span><span class="online">ONLINE</span></div>
        <div class="node-item"><span>NYC_Vault</span><span style="color:var(--danger)">LOCKED</span></div>
        <div class="node-item"><span>Berlin_Edge</span><span class="online">ONLINE</span></div>
    </aside>

    <footer>
        <div>LOC: 34.0522° N (ENCRYPTED)</div>
        <div>
            OPERATOR: <a href="https://instagram.com/h9exe" target="_blank" class="insta-link">@h9exe</a>
        </div>
    </footer>
</div>

<script>
    const output = document.getElementById('output');
    const input = document.getElementById('commandInput');

    // 1. Clock & Bars
    setInterval(() => {
        document.getElementById('clock').textContent = new Date().toLocaleTimeString();
        document.getElementById('cpu-bar').style.width = Math.floor(Math.random() * 50 + 20) + '%';
        document.getElementById('ram-bar').style.width = Math.floor(Math.random() * 30 + 40) + '%';
    }, 1000);

    // 2. Encryption Key
    setInterval(() => {
        let key = "AES_";
        const chars = "0123456789ABCDEF";
        for(let i=0; i<24; i++) key += chars[Math.floor(Math.random()*16)];
        document.getElementById('enc-key').textContent = key;
    }, 150);

    // 3. Print Function
    function print(text, type = 'info') {
        const div = document.createElement('div');
        const colors = { info: '#ccc', success: '#00ff9d', danger: '#ff3e3e', accent: '#0084ff' };
        div.style.color = colors[type];
        div.style.marginBottom = '5px';
        div.innerHTML = `<span style="color: #444">[${new Date().toLocaleTimeString([], {hour12:false})}]</span> ${text}`;
        output.appendChild(div);
        output.scrollTop = output.scrollHeight;
    }

    // 4. Command Handling
    input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const cmd = input.value.toLowerCase().trim();
            print(`guest@h9exe:~$ ${cmd}`, 'success');

            if(cmd === 'help') {
                print("Commands: status, ddos, clear, insta, audit", 'info');
            } 
            else if(cmd === 'status') {
                print("Systems: Nominal. Firewall: Active. Proxy: Enabled.", 'accent');
            }
            else if(cmd === 'ddos') {
                print("INITIALIZING DDOS PROTOCOL...", 'danger');
                print("TARGET: DISCORD_GATEWAY", 'danger');
                print("BYPASSING CLOUDFLARE... 40%", 'info');
                setTimeout(() => print("BYPASSING CLOUDFLARE... 100%", 'info'), 800);
                setTimeout(() => {
                    print("HANDSHAKE SUCCESSFUL. REDIRECTING...", 'success');
                    setTimeout(() => {
                        window.location.href = "https://discord.gg/lrnn";
                    }, 1000);
                }, 1800);
            }
            else if(cmd === 'insta') {
                print("Opening @h9exe Instagram...", 'accent');
                window.open('https://instagram.com/h9exe', '_blank');
            }
            else if(cmd === 'clear') {
                output.innerHTML = '';
            }
            else {
                print(`Unknown command: ${cmd}`, 'danger');
            }
            input.value = '';
        }
    });

    // 5. Fake Threat Feed
    const threats = ["Port Scan Blocked", "SSH Login Attempt", "Packet Injected", "Node Syncing", "Buffer Overflow Prevented"];
    setInterval(() => {
        const feed = document.getElementById('threat-feed');
        const div = document.createElement('div');
        div.className = 'node-item';
        div.innerHTML = `<span>${threats[Math.floor(Math.random()*threats.length)]}</span><span style="color:#555">DETECTED</span>`;
        feed.prepend(div);
        if(feed.children.length > 6) feed.lastChild.remove();
    }, 3000);

    // Boot Sequence
    print("Kernel v4.0.2 Loading...", 'accent');
    setTimeout(() => print("Handshake with @h9exe proxy... OK", 'success'), 1000);
</script>

</body>
</html>

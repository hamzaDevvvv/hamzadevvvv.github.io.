<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>root@h9exe~/> — Secure Console</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Orbitron&family=Inter&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  background:#050505;
  color:#e0e0e0;
  font-family:Inter, sans-serif;
  height:100vh;
  overflow:hidden;
}

/* Grid background */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    linear-gradient(#111 1px, transparent 1px),
    linear-gradient(90deg,#111 1px,transparent 1px);
  background-size:40px 40px;
  opacity:.35;
  z-index:-1;
}

/* Floating dashboard */
.console{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:90%;
  max-width:1050px;
  background:linear-gradient(180deg,#0c0c0c,#050505);
  border:1px solid #333;
  border-radius:18px;
  padding:28px;
  box-shadow:0 0 80px rgba(255,255,255,.08);
  animation:float 6s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translate(-50%,-50%) translateY(0)}
  50%{transform:translate(-50%,-50%) translateY(-12px)}
}

/* Header */
.top{
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid #222;
  padding-bottom:16px;
}

.title{
  font-family:Orbitron;
  font-size:38px;
  letter-spacing:3px;
}

.subtitle{
  font-size:11px;
  color:#888;
  margin-top:6px;
}

.sys{
  text-align:right;
  font-size:11px;
  color:#aaa;
}

/* Panels */
.panels{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  margin-top:24px;
}

.panel{
  background:#090909;
  border:1px solid #222;
  border-radius:10px;
  padding:16px;
}

.panel h3{
  font-size:10px;
  letter-spacing:2px;
  color:#999;
  margin-bottom:10px;
}

/* Traffic bars */
.bars{
  display:flex;
  gap:6px;
}
.bar{
  flex:1;
  height:20px;
  background:#151515;
  border:1px solid #333;
}
.bar.active{
  background:#cfcfcf;
}

/* Tasks */
.tasks{
  font-family:monospace;
  font-size:13px;
  line-height:1.5;
}

/* Buttons */
.buttons{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin-top:22px;
}
.btn{
  background:#080808;
  border:1px solid #333;
  color:#ccc;
  padding:12px;
  font-size:11px;
  letter-spacing:1px;
  border-radius:6px;
  text-align:center;
}

/* Terminal */
.terminal{
  margin-top:22px;
  height:140px;
  background:#020202;
  border:1px solid #333;
  padding:10px;
  font-family:monospace;
  font-size:12px;
  color:#ccc;
  overflow:auto;
}

/* Instagram */
.insta{
  position:absolute;
  bottom:16px;
  right:20px;
  font-size:12px;
  color:#777;
}
.insta a{
  color:#e0e0e0;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="console">

  <div class="top">
    <div>
      <div class="title">h9exe</div>
      <div class="subtitle">// ETHICAL CYBER OPERATIONS
        https://discord.com/lrnn #ddos//</div>
    </div>
    <div class="sys">
      <div id="time"></div>
      <div>UPLINK: SECURE</div>
    </div>
  </div>

  <div class="panels">
    <div class="panel">
      <h3>TRAFFIC MONITORING</h3>
      <div class="bars" id="bars"></div>
    </div>

    <div class="panel">
      <h3>ACTIVE TASKS</h3>
      <div class="tasks" id="tasks"></div>
    </div>
  </div>

  <div class="buttons">
    <div class="btn">TRAFFIC</div>
    <div class="btn">DDOS</div>
    <div class="btn">PWD ANALYSIS</div>
    <div class="btn">ETHICAL MODE</div>
  </div>

  <div class="terminal" id="terminal"></div>

  <div class="insta">
    Instagram → <a href="https://instagram.com/h9exe" target="_blank">@h9exe</a>
  </div>

</div>

<script>
/* Clock */
setInterval(()=>{
  document.getElementById("time").textContent=new Date().toLocaleTimeString();
},1000);

/* Bars */
const bars=document.getElementById("bars");
for(let i=0;i<6;i++){
  const b=document.createElement("div");
  b.className="bar";
  bars.appendChild(b);
}
setInterval(()=>{
  [...bars.children].forEach(b=>b.classList.toggle("active",Math.random()>.5));
},700);

/* Tasks */
const tasks=[
  "Brute-force simulation... 72%",
  "Packet inspection... DONE",
  "DDoS mitigation... RUNNING",
  "Credential audit... ACTIVE",
  "System integrity... OK"
];
setInterval(()=>{
  document.getElementById("tasks").textContent="> "+tasks[Math.floor(Math.random()*tasks.length)];
},1300);

/* Terminal */
const term=document.getElementById("terminal");
setInterval(()=>{
  const l=document.createElement("div");
  l.textContent="[SECURE] Link stable — "+Math.floor(Math.random()*9000);
  term.appendChild(l);
  term.scrollTop=term.scrollHeight;
},1200);
</script>

</body>
</html>

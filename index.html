<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>h9exe // Command Center</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ff9d; /* Neon Green */
            --accent: #ff3e3e;  /* Red for DDOS */
            --blue: #0084ff;
            --bg: #050506;
            --panel-bg: rgba(15, 15, 20, 0.95);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 255, 157, 0.05) 0%, transparent 80%),
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: #e0e0e0;
            font-family: 'JetBrains Mono', monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Scanline Effect */
        body::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            z-index: 100;
            pointer-events: none;
            opacity: 0.3;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            z-index: 10;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            color: var(--primary);
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(0, 255, 157, 0.5);
        }

        /* Panel Styling */
        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Terminal Area */
        .terminal-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0; /* Important for scrolling */
        }

        #output {
            flex: 1;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 10px;
            padding-right: 5px;
        }

        .input-line {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 4px;
        }

        .input-line span { color: var(--primary); margin-right: 10px; font-weight: bold; }
        
        input {
            background: transparent;
            border: none;
            color: #fff;
            outline: none;
            width: 100%;
            font-family: inherit;
            font-size: 14px;
        }

        /* Stats Section */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
        }

        .stat-card {
            background: rgba(0,0,0,0.3);
            padding: 8px;
            border-left: 2px solid var(--blue);
        }

        .stat-label { font-size: 10px; color: #666; text-transform: uppercase; }
        .stat-value { font-size: 14px; color: var(--blue); }

        /* Footer */
        footer {
            text-align: center;
            padding: 10px;
            font-size: 11px;
            color: #444;
            border-top: 1px solid var(--border);
        }

        .insta-tag {
            color: var(--primary);
            text-decoration: none;
            font-weight: bold;
        }

        /* Animations */
        .loading-bar {
            height: 2px;
            background: var(--accent);
            width: 0%;
            box-shadow: 0 0 10px var(--accent);
            margin: 10px 0;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <div class="title">h9exe</div>
            <div style="font-size: 10px; color: #888;">// ETHICAL_OPERATIONS_MODE</div>
        </div>
        <div style="text-align: right">
            <div id="clock" style="color: white; font-size: 14px;">00:00:00</div>
            <div style="color: var(--primary); font-size: 9px;">● ENCRYPTION: ACTIVE</div>
        </div>
    </header>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-label">Uplink Status</div>
            <div class="stat-value">SECURE</div>
        </div>
        <div class="stat-card" style="border-left-color: var(--primary);">
            <div class="stat-label">Traffic Load</div>
            <div class="stat-value" id="load-val">12.4%</div>
        </div>
    </div>

    <main class="panel terminal-box">
        <div id="output"></div>
        <div class="input-line">
            <span>$</span>
            <input type="text" id="cmd" placeholder="Type 'help' or 'ddos'..." autocomplete="off" autofocus>
        </div>
    </main>

    <footer>
        SYS_OPERATOR: h9exe | <a href="https://instagram.com/h9exe" target="_blank" class="insta-tag">@h9exe</a>
    </footer>
</div>

<script>
    const output = document.getElementById('output');
    const cmdInput = document.getElementById('cmd');

    // 1. Live Clock
    setInterval(() => {
        document.getElementById('clock').textContent = new Date().toLocaleTimeString();
    }, 1000);

    // 2. Random Load Generator
    setInterval(() => {
        document.getElementById('load-val').textContent = (Math.random() * 80).toFixed(1) + "%";
    }, 3000);

    // 3. Print to Terminal
    function print(text, color = "#ccc", delay = 0) {
        setTimeout(() => {
            const div = document.createElement('div');
            div.style.color = color;
            div.style.marginBottom = '5px';
            div.innerHTML = `<span style="color: #444;">[${new Date().toLocaleTimeString([], {hour12:false})}]</span> ${text}`;
            output.appendChild(div);
            output.scrollTop = output.scrollHeight;
        }, delay);
    }

    // 4. Initial Boot
    print("Initializing h9exe secure environment...", var(--blue), 500);
    print("Loading modules... DONE", var(--primary), 1000);
    print("Welcome back, Operator h9exe. Type 'help' to start.", "#fff", 1500);

    // 5. Command Logic
    cmdInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            const input = this.value.toLowerCase().trim();
            print(`guest@h9exe:~$ ${input}`, var(--primary));

            if (input === 'help') {
                print("Available commands: ddos, info, clear, insta", "#fff");
            } 
            else if (input === 'ddos') {
                print("!!! WARNING: INITIATING DDOS PROTOCOL !!!", var(--accent));
                print("Targeting: discord.gg/lrnn", var(--accent));
                
                // Visual Loading Bar
                const loader = document.createElement('div');
                loader.className = 'loading-bar';
                output.appendChild(loader);
                
                let width = 0;
                const interval = setInterval(() => {
                    width += 5;
                    loader.style.width = width + "%";
                    if (width >= 100) {
                        clearInterval(interval);
                        print("HANDSHAKE SUCCESSFUL. REDIRECTING...", var(--primary));
                        setTimeout(() => {
                            window.location.href = "https://discord.gg/lrnn";
                        }, 1000);
                    }
                }, 50);
            } 
            else if (input === 'info') {
                print("System: h9exe Custom OS", var(--blue));
                print("Status: Operationally stealthy", var(--blue));
            } 
            else if (input === 'insta') {
                print("Opening Instagram @h9exe...", var(--blue));
                window.open('https://instagram.com/h9exe', '_blank');
            }
            else if (input === 'clear') {
                output.innerHTML = '';
            }
            else {
                print("Unknown command. Type 'help'.", "#666");
            }

            this.value = '';
        }
    });

    // Handle focus for mobile
    document.addEventListener('click', () => cmdInput.focus());
</script>

</body>
</html>

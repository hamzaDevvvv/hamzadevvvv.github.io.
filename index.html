<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H9 // Offensive Research</title>
    <style>
        :root {
            --bg-color: #050505;
            --panel-bg: rgba(18, 18, 18, 0.9);
            --text-main: #dcdcdc;
            --accent: #ffffff;
            --dim-text: #666;
            --border: #333;
            --matrix-green: rgba(0, 255, 70, 0.15);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden; /* Matrix canvas handles the background */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Matrix Canvas */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 0;
        }

        .os-container {
            position: relative;
            z-index: 1;
            background: var(--panel-bg);
            width: 95%;
            max-width: 900px;
            padding: 30px;
            border: 1px solid var(--border);
            border-radius: 15px;
            box-shadow: 0 0 50px rgba(0,0,0,1);
            backdrop-filter: blur(5px);
            box-sizing: border-box;
        }

        /* Glitch Animation for H9 */
        .glitch {
            font-size: 3rem;
            font-weight: bold;
            text-transform: uppercase;
            position: relative;
            text-shadow: 0.05em 0 0 #00fffc, -0.03em -0.04em 0 #fc00ff, 0.025em 0.04em 0 #fffc00;
            animation: glitch 725ms infinite;
        }

        @keyframes glitch {
            0% { text-shadow: 0.05em 0 0 #00fffc, -0.03em -0.04em 0 #fc00ff, 0.025em 0.04em 0 #fffc00; }
            15% { text-shadow: 0.05em 0 0 #00fffc, -0.03em -0.04em 0 #fc00ff, 0.025em 0.04em 0 #fffc00; }
            16% { text-shadow: -0.05em -0.025em 0 #00fffc, 0.025em 0.035em 0 #fc00ff, -0.05em -0.05em 0 #fffc00; }
            49% { text-shadow: -0.05em -0.025em 0 #00fffc, 0.025em 0.035em 0 #fc00ff, -0.05em -0.05em 0 #fffc00; }
            50% { text-shadow: 0.05em 0.035em 0 #00fffc, 0.03em 0 0 #fc00ff, 0 -0.04em 0 #fffc00; }
            99% { text-shadow: 0.05em 0.035em 0 #00fffc, 0.03em 0 0 #fc00ff, 0 -0.04em 0 #fffc00; }
            100% { text-shadow: -0.05em 0 0 #00fffc, -0.025em -0.04em 0 #fc00ff, -0.04em -0.025em 0 #fffc00; }
        }

        header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-right { text-align: right; font-size: 0.8rem; color: var(--text-main); }
        .secure-tag { color: #0f0; font-weight: bold; border: 1px solid #0f0; padding: 0 4px; }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .panel {
            border: 1px solid var(--border);
            padding: 15px;
            background: rgba(0,0,0,0.5);
            border-radius: 8px;
        }

        .panel-title { font-size: 0.7rem; color: var(--dim-text); margin-bottom: 10px; text-transform: uppercase; }

        /* Real Dynamic Traffic Bars */
        .traffic-bars { display: flex; align-items: flex-end; gap: 5px; height: 50px; }
        .bar { background: #fff; width: 100%; transition: height 0.2s ease; }

        .nav-buttons { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 25px; }
        .btn {
            padding: 10px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--accent);
            font-size: 0.75rem;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: 0.2s;
        }
        .btn:hover { background: #fff; color: #000; box-shadow: 0 0 10px #fff; }
        .btn.insta { border-color: #fc00ff; color: #fc00ff; }
        .btn.insta:hover { background: #fc00ff; color: #fff; box-shadow: 0 0 15px #fc00ff; }

        .terminal-area {
            background: #000;
            padding: 15px;
            border-radius: 5px;
            font-size: 0.85rem;
            height: 200px;
            overflow-y: auto;
            border: 1px solid #222;
        }
        .terminal-input-row { display: flex; gap: 8px; }
        #terminal-input {
            background: transparent;
            border: none;
            color: #0f0;
            outline: none;
            flex: 1;
            font-family: inherit;
        }

        @media (max-width: 600px) {
            .dashboard-grid { grid-template-columns: 1fr; }
            .header-right { text-align: left; }
            .os-container { padding: 15px; height: 95vh; overflow-y: auto; }
        }
    </style>
</head>
<body>

<canvas id="matrix-canvas"></canvas>

<div class="os-container">
    <header>
        <div class="header-left">
            <div class="status" style="color: #666; font-size: 0.7rem;">[ UPLINK_ESTABLISHED ]</div>
            <div class="glitch">H9EXE</div>
            <div style="color: #666; font-size: 0.8rem;">// SA_SEC_OPERATIVE // OFFENSIVE_RECON</div>
        </div>
        <div class="header-right">
            <div id="date-display">JAN_25_2026</div>
            <div id="clock-display">00:00:00</div>
            <div>STATUS: <span class="secure-tag">ENCRYPTED</span></div>
        </div>
    </header>

    <div class="dashboard-grid">
        <div class="panel">
            <div class="panel-title">Network Latency</div>
            <div class="traffic-bars" id="bar-container">
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            </div>
        </div>
        <div class="panel">
            <div class="panel-title">System Tasking</div>
            <div style="font-size: 0.8rem;">
                [>] PWD_BRUTE: <span id="percent" style="color:#fff">0%</span><br>
                [>] TARGET: <span style="color:#fff">H9-SEC.NET</span><br>
                [>] PROXY: <span style="color:#0f0">ACTIVE</span>
            </div>
        </div>
    </div>

    <div class="nav-buttons">
        <a href="#" class="btn" onclick="processCommand('scan')">SCANNER</a>
        <a href="#" class="btn" onclick="processCommand('crack')">CRACK_TOOL</a>
        <a href="https://instagram.com/h9exe" target="_blank" class="btn insta">INSTAGRAM: @H9EXE</a>
    </div>

    <div class="terminal-area">
        <div id="terminal-output">H9-OS v3.0 // Ready for input...</div>
        <div class="terminal-input-row">
            <span style="color:#888">h9exe@offensive-lab:~$</span>
            <input type="text" id="terminal-input" autofocus autocomplete="off" spellcheck="false">
        </div>
    </div>
</div>

<script>
    // 1. Matrix Animation
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()*&^%";
    const fontSize = 16;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);

    function drawMatrix() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#0F0"; // Green text
        ctx.font = fontSize + "px monospace";
        for (let i = 0; i < drops.length; i++) {
            const text = letters.charAt(Math.floor(Math.random() * letters.length));
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);
            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        }
    }
    setInterval(drawMatrix, 35);

    // 2. Real-time Clock
    setInterval(() => {
        const now = new Date();
        document.getElementById('clock-display').innerText = now.toTimeString().split(' ')[0] + "_GMT+3";
    }, 1000);

    // 3. Dynamic Traffic Bars
    function updateBars() {
        const bars = document.querySelectorAll('.bar');
        bars.forEach(bar => {
            const height = Math.floor(Math.random() * 100);
            bar.style.height = height + "%";
            bar.style.opacity = (height / 100) + 0.2;
        });
    }
    setInterval(updateBars, 300);

    // 4. Task Percentage
    let p = 0;
    setInterval(() => {
        p = p < 100 ? p + 1 : 0;
        document.getElementById('percent').innerText = p + "%";
    }, 500);

    // 5. Terminal Logic
    const input = document.getElementById('terminal-input');
    const output = document.getElementById('terminal-output');

    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            processCommand(input.value.toLowerCase().trim());
            input.value = '';
        }
    });

    function processCommand(cmd) {
        if(!cmd) return;
        output.innerHTML += `<div><span style="color:#888">h9exe@lab:~$</span> ${cmd}</div>`;
        
        if (cmd === 'instagram' || cmd === 'insta') {
            output.innerHTML += `<div>[REDIRECT] Opening @h9exe uplink...</div>`;
            window.open('https://instagram.com/h9exe', '_blank');
        } else if (cmd === 'crack') {
            let i = 0;
            const interval = setInterval(() => {
                output.innerHTML += `<div>[TRYING] HASH_BLOCK_${Math.floor(Math.random()*999)}... FAIL</div>`;
                output.parentElement.scrollTop = output.parentElement.scrollHeight;
                if (i++ > 5) {
                    clearInterval(interval);
                    output.innerHTML += `<div style="color:#fff">[SUCCESS] KEY_FOUND: 'H9_ADMIN_PASS'</div><br>`;
                }
            }, 100);
        } else if (cmd === 'clear') {
            output.innerHTML = "";
        } else {
            output.innerHTML += `<div>System: Command '${cmd}' not recognized.</div>`;
        }
        output.parentElement.scrollTop = output.parentElement.scrollHeight;
    }
</script>

</body>
</html>

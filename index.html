<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>h9exe | Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ff9d; 
            --bg: #050506;
            --panel-bg: rgba(15, 15, 20, 0.9);
            --border: rgba(0, 255, 157, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: #e0e0e0;
            font-family: 'JetBrains Mono', monospace;
            min-height: 100vh;
            overflow-y: auto; /* يسمح بالسكرول */
            position: relative;
        }

        /* تحريك الخلفية */
        .grid-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            animation: moveGrid 20s linear infinite;
        }

        @keyframes moveGrid {
            from { background-position: 0 0; }
            to { background-position: 0 400px; }
        }

        /* شاشة الدخول */
        #login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 4px solid var(--primary);
        }

        .login-box { text-align: center; }
        .login-box h2 { font-family: 'Orbitron'; color: var(--primary); margin-bottom: 20px; letter-spacing: 5px; }
        .login-box input {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 10px;
            text-align: center;
            outline: none;
            font-family: inherit;
        }

        /* الهيكل الأساسي */
        .main-frame {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .title { font-family: 'Orbitron'; font-size: 2rem; color: var(--primary); text-shadow: 0 0 10px var(--primary); }

        /* الألواح */
        .layout-grid {
            display: grid;
            grid-template-columns: 250px 1fr 250px;
            gap: 15px;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            padding: 15px;
            backdrop-filter: blur(5px);
            position: relative;
            overflow: hidden;
        }

        .panel::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: var(--primary); animation: scanLine 3s linear infinite;
        }

        @keyframes scanLine { 0% { top: 0; } 100% { top: 100%; } }

        .panel-header {
            font-size: 11px; color: var(--primary);
            border-bottom: 1px solid var(--border);
            margin-bottom: 10px; padding-bottom: 5px;
            font-weight: bold;
        }

        /* التيرمنال */
        .terminal-container { height: 500px; display: flex; flex-direction: column; }
        #output { flex-grow: 1; overflow-y: auto; font-size: 13px; margin-bottom: 10px; scroll-behavior: smooth; }
        .input-area { display: flex; gap: 5px; align-items: center; }
        #commandInput { background: transparent; border: none; color: #fff; outline: none; flex-grow: 1; font-family: inherit; }

        /* أشياء تتحرك */
        .progress-bar { height: 4px; background: #222; margin-top: 5px; }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }

        .node-item { display: flex; justify-content: space-between; font-size: 10px; padding: 5px 0; border-bottom: 1px solid rgba(0,255,157,0.1); }

        /* للموبايل */
        @media (max-width: 900px) {
            .layout-grid { grid-template-columns: 1fr; }
            .hide-mobile { display: none; }
            .terminal-container { height: 400px; }
        }

        footer { text-align: center; padding: 20px; font-size: 10px; color: #555; }
        .insta-tag { color: var(--primary); text-decoration: none; }
    </style>
</head>
<body>

<div class="grid-bg"></div>

<div id="login-overlay">
    <div class="login-box">
        <h2>ACCESS REQUIRED</h2>
        <input type="text" id="usernameInput" placeholder="ENTER USERNAME..." autocomplete="off">
        <p style="font-size: 9px; color: #555; margin-top: 10px;">AUTHORIZED PERSONNEL ONLY</p>
    </div>
</div>

<div class="main-frame">
    <header>
        <div class="title">h9exe</div>
        <div style="text-align: right">
            <div id="clock">00:00:00</div>
            <div style="font-size: 9px; color: var(--primary);">SYSTEM: ONLINE</div>
        </div>
    </header>

    <div class="layout-grid">
        <aside class="panel hide-mobile">
            <div class="panel-header">CORE STATUS</div>
            <div class="stat-row">
                <span style="font-size: 10px;">CPU LOAD</span>
                <div class="progress-bar"><div id="cpu-bar" class="progress-fill"></div></div>
            </div>
            <div class="stat-row" style="margin-top:10px;">
                <span style="font-size: 10px;">MEMORY</span>
                <div class="progress-bar"><div id="ram-bar" class="progress-fill"></div></div>
            </div>
            <div class="panel-header" style="margin-top: 20px;">OPERATOR</div>
            <div id="op-name" style="color: var(--primary); font-size: 14px;">Guest</div>
        </aside>

        <main class="panel terminal-container">
            <div class="panel-header">TERMINAL v2.0 - SECURE_SESSION</div>
            <div id="output"></div>
            <div class="input-area">
                <span id="prompt" style="color: var(--primary); white-space: nowrap;">guest@h9exe:~$</span>
                <input type="text" id="commandInput" autofocus autocomplete="off">
            </div>
        </main>

        <aside class="panel hide-mobile">
            <div class="panel-header">THREAT DETECTION</div>
            <div id="threats"></div>
            <div class="panel-header" style="margin-top: 20px;">NETWORK NODES</div>
            <div class="node-item"><span>Riyadh_Node</span><span style="color:var(--primary)">ACTIVE</span></div>
            <div class="node-item"><span>Proxy_Chain</span><span style="color:var(--primary)">ON</span></div>
        </aside>
    </div>

    <footer>
        <p>H9EXE DIGITAL ARCHITECTURE &copy; 2024 | <a href="https://instagram.com/h9exe" class="insta-tag">@h9exe</a></p>
    </footer>
</div>

<script>
    let currentUser = "guest";
    const output = document.getElementById('output');
    const input = document.getElementById('commandInput');
    const userIn = document.getElementById('usernameInput');

    // تسجيل الدخول
    userIn.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && userIn.value.trim() !== "") {
            currentUser = userIn.value.trim();
            document.getElementById('op-name').textContent = currentUser;
            document.getElementById('prompt').textContent = `${currentUser}@h9exe:~$`;
            document.getElementById('login-overlay').style.display = 'none';
            bootSequence();
        }
    });

    function print(text, color = '#ccc') {
        const div = document.createElement('div');
        div.style.color = color;
        div.style.marginBottom = '5px';
        div.innerHTML = `<span style="color:#444">[${new Date().toLocaleTimeString()}]</span> ${text}`;
        output.appendChild(div);
        output.scrollTop = output.scrollHeight;
    }

    function bootSequence() {
        print("Initializing Kernel...", "#00ff9d");
        setTimeout(() => print("Establishing connection to h9exe nodes...", "#00ff9d"), 500);
        setTimeout(() => print(`Welcome back, Agent ${currentUser}. System is ready.`, "#fff"), 1200);
    }

    // الأوامر
    const cmdList = {
        'help': () => print("Commands: ls, cat, status, socials, hack, clear, whoami"),
        'ls': () => print("bio.txt&nbsp;&nbsp;&nbsp;projects/&nbsp;&nbsp;&nbsp;social_links.sh&nbsp;&nbsp;&nbsp;secret.key"),
        'whoami': () => print(`User: ${currentUser}<br>Role: Security Specialist<br>Host: h9exe_Mainframe`),
        'status': () => print("All systems nominal. Encryption active.", "#00ff9d"),
        'socials': () => print("Instagram: <a href='https://instagram.com/h9exe' target='_blank' style='color:#00ff9d'>@h9exe</a>", "#00ff9d"),
        'cat bio.txt': () => print("h9exe: Virtual architect specializing in aesthetic code and secure interfaces."),
        'clear': () => output.innerHTML = '',
        'hack': () => {
            print("INITIALIZING BRUTE FORCE...", "red");
            let i = 0;
            const interval = setInterval(() => {
                print(`Bypassing Layer ${i}%...`, "red");
                i += 20;
                if (i > 100) {
                    clearInterval(interval);
                    print("ACCESS GRANTED. (Just kidding, it's a demo!)", "#00ff9d");
                }
            }, 300);
        }
    };

    input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const cmd = input.value.toLowerCase().trim();
            print(`${currentUser}@h9exe:~$ ${cmd}`, "#00ff9d");
            if (cmdList[cmd]) cmdList[cmd]();
            else if (cmd !== "") print(`Unknown command: ${cmd}. Type 'help' for info.`, "orange");
            input.value = '';
        }
    });

    // تحركات الأشرطة والساعة
    setInterval(() => {
        document.getElementById('clock').textContent = new Date().toLocaleTimeString();
        document.getElementById('cpu-bar').style.width = Math.floor(Math.random() * 60 + 20) + '%';
        document.getElementById('ram-bar').style.width = Math.floor(Math.random() * 40 + 10) + '%';
    }, 1000);

    // تهديدات وهمية تتحرك
    const tTexts = ["Port scan blocked", "SSH attempt from 182.xx", "Packet filtered", "Node sync OK"];
    setInterval(() => {
        const tDiv = document.getElementById('threats');
        const d = document.createElement('div');
        d.className = 'node-item';
        d.innerHTML = `<span>${tTexts[Math.floor(Math.random()*tTexts.length)]}</span><span style="color:#444">LOG</span>`;
        tDiv.prepend(d);
        if(tDiv.children.length > 5) tDiv.lastChild.remove();
    }, 3000);

</script>
</body>
</html>
